<!doctype html>
<html lang="en">

        "topojson-client": "https://cdn.jsdelivr.net/npm/topojson-client@3/+esm"
      }
    }
  </script>
</head>
<body>
  <div id="standalone-root"></div>
  <script type="module" src="script.js"></script>
</body>
</html>
